[project]
name = "ai-researcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Douglas Costa", email = "douglaza@gmail.com@github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "chainlit>=2.12.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-google-vertexai>=3.2.5",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sse-starlette>=3.7.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-researcher = "ai_researcher:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
